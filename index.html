<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Score Board</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <h1 class="boom">SCORE BOARD</h1>
    <div class="container">
        
        
        <!-- HOME TEAM -->
        <div class="team">
            <h3>HOME</h3>
            <h4 class="score" id="h-score">0</h4>
            
            <div>
                <button class="btn" id="home-increment1" onclick="plusoneh()">+1</button>
                <button class="btn" id="home-increment2" onclick="plustwoh()">+2</button>
                <button class="btn" id="home-increment3" onclick="plusthreeh()">+3</button>
            </div>
            
            
            <!-- Foul Home -->
            <div class="fouls" id="hfoul">
                <h2>FOULS ( HOME )</h2>
                <h3 class="foul" id="h-foul">0</h3>
                
                <button class="btn" id="fh-btn" onclick="foulinch()"> +1 </button>
            </div>
        </div>
          
          <!--reset -->
           <div class="reset">
            <button  id= "r-set"class="btn" onclick="resetAll()">RESET</button>
          </div>
 
        <!-- GUEST TEAM -->
        <div class="team">
            <h3>AWAY</h3>
            <h4 class="score" id="g-score">0</h4>
            
            <div>
                <button class="btn" id="gst-increment1" onclick="plusoneg()">+1</button>
                <button class="btn" id="gst-increment2" onclick="plustwog()">+2</button>
                <button class="btn" id="gst-increment3" onclick="plusthreeg()">+3</button>
            </div>
            
               <!--Guest Foul -->
               
               <h2> FOULS ( AWAY ) </h2>
               <h3 class="foul" id="g-foul">0</h3>
               <button class = "btn" id="fg-btn" onclick="foulincg()"> +1 </button>
               
            
        </div>
        
        
        
    </div>
    
       


    <script src="index.js"></script>
</body>
</html>
